name: Deploy Production Website to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger Web Root
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            set -e
            echo "Navigating to web root..."
            cd /home/u922787661/domains/danielkill.online/public_html

            if [ ! -d ".git" ]; then
              echo "Target directory has no git repo. Initializing fresh clone..."
              rm -f default.php
              git clone https://github.com/daniel-kill/production-website.git .
            else
              echo "Fetching and hard-resetting to origin/main..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Set standard Hostinger directory & file permissions
            find . -type f -exec chmod 644 {} +
            find . -type d -exec chmod 755 {} +
            mkdir -p data
            chmod 750 data

            echo "Deployment completed successfully at $(date -u)"
